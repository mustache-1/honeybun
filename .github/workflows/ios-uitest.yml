# Real-touch test of the native screens: the simulator swipes up on Home and Money like a finger, then photographs the very bottom.
# Pictures are pushed to the `ci-shots` branch. Nothing here touches TestFlight or the App Store.
name: iPhone app (native scroll test)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-uitest
  cancel-in-progress: true

jobs:
  uitest:
    runs-on: macos-15
    timeout-minutes: 50
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use the newest Xcode
        working-directory: .
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install Capacitor and sync the native project
        run: |
          npm install
          npx cap sync ios
      - name: Add the native targets and the UI test target
        run: HB_UITESTS=1 ruby scripts/setup_native.rb
      - name: Install pods
        working-directory: ios-app/ios/App
        run: pod install
      - name: Run the touch test
        working-directory: ios-app/ios/App
        shell: bash
        run: |
          log() { echo "[$(date -u +%H:%M:%S)] $*"; }
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devs.json"
          UDID=$(python3 - "$RUNNER_TEMP/devs.json" <<'PY'
          import json,sys,re
          d=json.load(open(sys.argv[1])); phones=[]
          for rt,devs in d['devices'].items():
              if 'iOS' not in rt: continue
              for x in devs:
                  if x['name'].startswith('iPhone'): phones.append((x['name'],x['udid']))
          m=[p for p in phones if re.search(r'iPhone 1[5-9] Pro$',p[0])] or [p for p in phones if p[0].endswith('Pro')] or phones
          print(m[-1][1])
          PY
          )
          log "device $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          rm -rf /tmp/hbshots; mkdir -p /tmp/hbshots
          set +e
          xcodebuild test -workspace App.xcworkspace -scheme HoneybunUITests -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$RUNNER_TEMP/ddui" \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES > "$RUNNER_TEMP/uitest.log" 2>&1
          log "xcodebuild exit $?"
          grep -E "error:|Test Case|TEST (SUCCEEDED|FAILED)|\\*\\* " "$RUNNER_TEMP/uitest.log" | tail -40
          ls -la /tmp/hbshots
      - name: Publish the pictures to the ci-shots branch
        if: always()
        working-directory: .
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/pub" && mkdir "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          git init -q && git checkout -q -b ci-shots
          cp /tmp/hbshots/* . 2>/dev/null || true
          grep -E "error:|Test Case.*(passed|failed)|TEST (SUCCEEDED|FAILED)" "$RUNNER_TEMP/uitest.log" > uitest.log.txt 2>/dev/null || true
          echo "native touch test from ${GITHUB_SHA}" > README.txt
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "touch test for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots

# Builds the Honeybun Windows installer and publishes it as the latest release.
# honeybun.me/download/windows serves that file, so the download link never changes.
name: Desktop app (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "public/icon-512.png"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

concurrency:
  group: desktop-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Make app icons from the website icon
        run: npm run icons

      - name: Build the installer
        run: npx tauri build

      - name: Give the installer a stable name
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName Honeybun-Setup.exe
          "Built $($exe.Name) ($([math]::Round($exe.Length / 1MB, 1)) MB)"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: Honeybun for Windows (build ${{ github.run_number }})
          body: Windows installer for Honeybun. People download it from honeybun.me/download/windows.
          files: desktop/Honeybun-Setup.exe
          make_latest: true

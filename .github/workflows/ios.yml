# Checks that the Honeybun iPhone app builds (unsigned, for the simulator). Shipping to the App Store
# needs an Apple Developer account and signing; see ios-app/README.md.
name: iPhone app (build check)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Capacitor
        run: npm install
      - name: Native SwiftUI check (models + Coming Up logic against a real /api/nest response)
        working-directory: ios-app
        run: |
          swiftc -D DEBUG -o /tmp/hbcheck ios/App/HoneybunSwiftUI/Models/HBModels.swift ios/App/HoneybunSwiftUI/Core/HBDates.swift ios/App/HoneybunSwiftUI/Core/HBChartMath.swift ios/App/HoneybunSwiftUI/Core/HBGoalStyle.swift ios/App/HoneybunSwiftUI/Core/HBTogether.swift ios/App/HoneybunSwiftUI/Core/HBInbox.swift ios/App/HoneybunSwiftUI/Core/HBPreviewData.swift tests/DecodeCheck/main.swift
          /tmp/hbcheck tests/fixtures/nest.json tests/fixtures/nest-goals.json tests/fixtures/nest-together.json tests/fixtures/inbox.json
      - name: Goals actions through the real API path (create, edit, quick-add, custom, take out, undo, complete, delete)
        working-directory: ios-app
        run: |
          swiftc -D DEBUG -o /tmp/hbgoals ios/App/HoneybunSwiftUI/Models/HBModels.swift ios/App/HoneybunSwiftUI/Core/HBDates.swift ios/App/HoneybunSwiftUI/Core/HBGoalStyle.swift ios/App/HoneybunSwiftUI/Core/HBTogether.swift ios/App/HoneybunSwiftUI/Core/HBPreviewData.swift ios/App/HoneybunSwiftUI/Core/HBPreviewVariants.swift ios/App/HoneybunSwiftUI/Core/HBPasskeyKit.swift ios/App/HoneybunSwiftUI/Core/HBMockServer.swift ios/App/HoneybunSwiftUI/Core/HBAPI.swift tests/GoalsFlowCheck/main.swift
          /tmp/hbgoals
      - name: Together actions through the real API path (settle up, shopping list, household, joint, edit yourself, search; solo, partner, family)
        working-directory: ios-app
        run: |
          swiftc -D DEBUG -o /tmp/hbtogether ios/App/HoneybunSwiftUI/Models/HBModels.swift ios/App/HoneybunSwiftUI/Core/HBDates.swift ios/App/HoneybunSwiftUI/Core/HBGoalStyle.swift ios/App/HoneybunSwiftUI/Core/HBTogether.swift ios/App/HoneybunSwiftUI/Core/HBPreviewData.swift ios/App/HoneybunSwiftUI/Core/HBPreviewVariants.swift ios/App/HoneybunSwiftUI/Core/HBPasskeyKit.swift ios/App/HoneybunSwiftUI/Core/HBMockServer.swift ios/App/HoneybunSwiftUI/Core/HBAPI.swift tests/TogetherFlowCheck/main.swift
          /tmp/hbtogether
      - name: Inbox through the real API path (messages, unread, Paid, carry-over, read; full and empty)
        working-directory: ios-app
        run: |
          swiftc -D DEBUG -o /tmp/hbinbox ios/App/HoneybunSwiftUI/Models/HBModels.swift ios/App/HoneybunSwiftUI/Core/HBDates.swift ios/App/HoneybunSwiftUI/Core/HBGoalStyle.swift ios/App/HoneybunSwiftUI/Core/HBTogether.swift ios/App/HoneybunSwiftUI/Core/HBInbox.swift ios/App/HoneybunSwiftUI/Core/HBPreviewData.swift ios/App/HoneybunSwiftUI/Core/HBPreviewVariants.swift ios/App/HoneybunSwiftUI/Core/HBPasskeyKit.swift ios/App/HoneybunSwiftUI/Core/HBMockServer.swift ios/App/HoneybunSwiftUI/Core/HBAPI.swift tests/InboxFlowCheck/main.swift
          /tmp/hbinbox > /tmp/inbox-run.txt 2>&1 || { grep -E 'FAIL|fail|error' /tmp/inbox-run.txt | head -20 | while IFS= read -r l; do echo "::error::${l:0:400}"; done; tail -5 /tmp/inbox-run.txt; exit 1; }
          tail -3 /tmp/inbox-run.txt
      - name: Authentication through the real API path (login, signup, Apple, passkeys, recovery, delete)
        working-directory: ios-app
        run: |
          (swiftc -D DEBUG -o /tmp/hbauth ios/App/HoneybunSwiftUI/Models/HBModels.swift ios/App/HoneybunSwiftUI/Core/HBDates.swift ios/App/HoneybunSwiftUI/Core/HBGoalStyle.swift ios/App/HoneybunSwiftUI/Core/HBTogether.swift ios/App/HoneybunSwiftUI/Core/HBInbox.swift ios/App/HoneybunSwiftUI/Core/HBPasskeyKit.swift ios/App/HoneybunSwiftUI/Core/HBPreviewData.swift ios/App/HoneybunSwiftUI/Core/HBPreviewVariants.swift ios/App/HoneybunSwiftUI/Core/HBMockServer.swift ios/App/HoneybunSwiftUI/Core/HBAPI.swift ios/App/HoneybunSwiftUI/Core/HBAuthAPI.swift ios/App/HoneybunSwiftUI/Core/HBSession.swift ios/App/HoneybunSwiftUI/Core/HBDeepLink.swift tests/AuthFlowCheck/main.swift) > /tmp/auth-build.txt 2>&1 || { grep -E "error" /tmp/auth-build.txt | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done; exit 1; }
          /tmp/hbauth tests/fixtures/passkey.json > /tmp/auth-run.txt 2>&1 || { tail -25 /tmp/auth-run.txt | while IFS= read -r l; do echo "::error::${l:0:400}"; done; exit 1; }
          cat /tmp/auth-run.txt | tail -5
      - name: Plan through the real API path (budgets, debts, subscriptions, calendar, forecast, own categories)
        working-directory: ios-app
        run: |
          (swiftc -D DEBUG -o /tmp/hbplan ios/App/HoneybunSwiftUI/Models/HBModels.swift ios/App/HoneybunSwiftUI/Core/HBDates.swift ios/App/HoneybunSwiftUI/Core/HBGoalStyle.swift ios/App/HoneybunSwiftUI/Core/HBTogether.swift ios/App/HoneybunSwiftUI/Core/HBInbox.swift ios/App/HoneybunSwiftUI/Core/HBCatStyle.swift ios/App/HoneybunSwiftUI/Core/HBPlan.swift ios/App/HoneybunSwiftUI/Core/HBPlanAPI.swift ios/App/HoneybunSwiftUI/Core/HBPasskeyKit.swift ios/App/HoneybunSwiftUI/Core/HBPreviewData.swift ios/App/HoneybunSwiftUI/Core/HBPreviewVariants.swift ios/App/HoneybunSwiftUI/Core/HBMockServer.swift ios/App/HoneybunSwiftUI/Core/HBAPI.swift tests/PlanFlowCheck/main.swift) > /tmp/plan-build.txt 2>&1 || { grep -E "error" /tmp/plan-build.txt | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done; exit 1; }
          /tmp/hbplan > /tmp/plan-run.txt 2>&1 || { grep -E "FAIL|rror" /tmp/plan-run.txt | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done; tail -5 /tmp/plan-run.txt; exit 1; }
          tail -4 /tmp/plan-run.txt
      - name: Stats, levels and badges, referrals and household changes through the real API path
        working-directory: ios-app
        run: |
          (swiftc -D DEBUG -o /tmp/hbstats ios/App/HoneybunSwiftUI/Models/HBModels.swift ios/App/HoneybunSwiftUI/Core/HBDates.swift ios/App/HoneybunSwiftUI/Core/HBGoalStyle.swift ios/App/HoneybunSwiftUI/Core/HBTogether.swift ios/App/HoneybunSwiftUI/Core/HBInbox.swift ios/App/HoneybunSwiftUI/Core/HBCatStyle.swift ios/App/HoneybunSwiftUI/Core/HBPlan.swift ios/App/HoneybunSwiftUI/Core/HBPlanAPI.swift ios/App/HoneybunSwiftUI/Core/HBProgress.swift ios/App/HoneybunSwiftUI/Core/HBStats.swift ios/App/HoneybunSwiftUI/Core/HBPasskeyKit.swift ios/App/HoneybunSwiftUI/Core/HBPreviewData.swift ios/App/HoneybunSwiftUI/Core/HBPreviewVariants.swift ios/App/HoneybunSwiftUI/Core/HBMockServer.swift ios/App/HoneybunSwiftUI/Core/HBAPI.swift tests/StatsFlowCheck/main.swift) > /tmp/stats-build.txt 2>&1 || { grep -E "error" /tmp/stats-build.txt | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done; exit 1; }
          /tmp/hbstats > /tmp/stats-run.txt 2>&1 || { grep -E "FAIL|rror" /tmp/stats-run.txt | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done; tail -5 /tmp/stats-run.txt; exit 1; }
          tail -4 /tmp/stats-run.txt
      - name: Sync the native project
        run: npx cap sync ios
      - name: Add the widget, Siri and push setup to the Xcode project
        run: ruby scripts/setup_native.rb
      - name: Install pods
        working-directory: ios-app/ios/App
        run: pod install
      - name: Build for the simulator
        working-directory: ios-app/ios/App
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -30
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            grep -E "error:" build.log | sort -u | head -25 | while IFS= read -r l; do echo "::error::${l:0:450}"; done
            exit 1
          fi
      - name: Show which app icons were built in
        working-directory: ios-app/ios/App
        shell: bash
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/App.app" -maxdepth 6 | head -1)
          echo "app: $APP"
          plutil -p "$APP/Info.plist" | grep -A12 -E "CFBundleIcons|CFBundleAlternateIcons" | head -40
          ls "$APP" | grep -i icon || true

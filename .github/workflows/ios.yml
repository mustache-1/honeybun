# Checks that the Honeybun iPhone app builds (unsigned, for the simulator). Shipping to the App Store
# needs an Apple Developer account and signing; see ios-app/README.md.
name: iPhone app (build check)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Capacitor
        run: npm install
      - name: Native SwiftUI check (models + Coming Up logic against a real /api/nest response)
        working-directory: ios-app
        run: |
          swiftc -o /tmp/hbcheck ios/App/HoneybunSwiftUI/Models/HBModels.swift ios/App/HoneybunSwiftUI/Core/HBDates.swift tests/DecodeCheck/main.swift
          /tmp/hbcheck tests/fixtures/nest.json
      - name: Sync the native project
        run: npx cap sync ios
      - name: Add the widget, Siri and push setup to the Xcode project
        run: ruby scripts/setup_native.rb
      - name: Install pods
        working-directory: ios-app/ios/App
        run: pod install
      - name: Build for the simulator
        working-directory: ios-app/ios/App
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -30
          grep -q "BUILD SUCCEEDED" build.log
      - name: Show which app icons were built in
        working-directory: ios-app/ios/App
        shell: bash
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/App.app" -maxdepth 6 | head -1)
          echo "app: $APP"
          plutil -p "$APP/Info.plist" | grep -A12 -E "CFBundleIcons|CFBundleAlternateIcons" | head -40
          ls "$APP" | grep -i icon || true

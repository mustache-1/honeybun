# Builds a signed Honeybun iPhone app and uploads it to TestFlight (run it by hand from the Actions tab).
# Needs an Apple Developer account and four repository secrets, see ios-app/README.md ("TestFlight").
name: iPhone app (TestFlight)

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    defaults:
      run:
        working-directory: ios-app
    steps:
      - name: Check the Apple secrets are set
        working-directory: .
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first (Settings > Secrets and variables > Actions):$missing. See ios-app/README.md."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Use the newest Xcode (Apple requires the iOS 26 SDK or later for uploads)
        working-directory: .
        run: |
          ls -d /Applications/Xcode_2*.app || true
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Xcode 26 or later isn't on this runner"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Install Capacitor and sync the native project
        run: |
          npm install
          npx cap sync ios

      - name: Add the widget, Siri and push setup to the Xcode project
        run: ruby scripts/setup_native.rb

      - name: Install pods
        working-directory: ios-app/ios/App
        run: pod install

      - name: Save the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive (unsigned; the export step below signs it for the App Store)
        working-directory: ios-app/ios/App
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Honeybun.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || true
          grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" "$RUNNER_TEMP/archive.log" | head -30
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"

      - name: Confirm the native SwiftUI foundation is inside the Release archive (stops the upload if not)
        working-directory: ios-app/ios/App
        shell: bash
        run: |
          APP="$RUNNER_TEMP/Honeybun.xcarchive/Products/Applications/App.app"
          missing=0
          echo "--- HoneybunSwiftUI files in the Xcode project (App target) ---"
          for f in $(cd HoneybunSwiftUI && find . -name '*.swift' | sed 's|^\./||' | sort); do
            b=$(basename "$f")
            if grep -q "$b in Sources" App.xcodeproj/project.pbxproj; then echo "ok   $f"; else echo "MISSING $f"; missing=1; fi
          done
          echo "--- compiled into the Release binary ---"
          BIN="$APP/App"
          for sym in openNativeApp HBRootView HBHomeView HBMoneyView HBEntryForm HBRecurringForm HBUpcomingList HBAppStore HBSession HBLauncher; do
            n=$(strings -a "$BIN" | grep -c "$sym" || true)
            echo "$sym: $n"
          done
          if ! strings -a "$BIN" | grep -q "openNativeApp"; then echo "::error::openNativeApp bridge method is not in the Release binary"; missing=1; fi
          if ! strings -a "$BIN" | grep -q "HBRootView"; then echo "::error::HBRootView is not in the Release binary"; missing=1; fi
          exit $missing

      - name: Put the app's permissions (push, App Group) into the archive before Apple signs it
        working-directory: ios-app/ios/App
        shell: bash
        run: |
          APP="$RUNNER_TEMP/Honeybun.xcarchive/Products/Applications/App.app"
          for f in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib; do [ -e "$f" ] && codesign --force --sign - "$f"; done
          for x in "$APP"/PlugIns/*.appex; do codesign --force --sign - --entitlements HoneybunWidget/HoneybunWidget.entitlements "$x"; done
          codesign --force --sign - --entitlements App/App.entitlements "$APP"
          echo "--- permissions now inside the archived app ---"
          codesign -d --entitlements :- "$APP" 2>/dev/null

      - name: Upload to TestFlight
        working-directory: ios-app/ios/App
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Honeybun.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" | grep -E "error:|EXPORT|Upload|upload|Progress" | head -40
          grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" "$RUNNER_TEMP/export.log"
          echo "Uploaded build ${{ github.run_number }}. It shows up in TestFlight after Apple finishes processing it (usually 5-30 minutes)."

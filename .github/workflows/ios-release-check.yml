# Archives the Release build WITHOUT signing or uploading anything (no secrets used) and checks what ended up inside it:
# the native authentication code, the artwork, the Sign in with Apple / passkey permissions, and that debug-only code is absent.
name: iPhone app (release archive check)

on:
  workflow_dispatch:
  push:
    branches: [claude/wizardly-ritchie-b9p7jn]
    paths: [".github/workflows/ios-release-check.yml"]

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use the newest Xcode
        working-directory: .
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install Capacitor and sync the native project
        run: |
          npm install
          npx cap sync ios
      - name: Add the widget, Siri and push setup to the Xcode project
        run: ruby scripts/setup_native.rb
      - name: Static project checks
        run: ruby scripts/check_project.rb
      - name: Install pods
        working-directory: ios-app/ios/App
        run: pod install
      - name: Archive (Release, unsigned)
        working-directory: ios-app/ios/App
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Honeybun.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || true
          grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" "$RUNNER_TEMP/archive.log" | sort -u | head -30
          if ! grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"; then
            grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -25 | while IFS= read -r l; do echo "::error::${l:0:450}"; done
            exit 1
          fi
      - name: What is inside the Release archive
        working-directory: ios-app/ios/App
        shell: bash
        run: |
          APP="$RUNNER_TEMP/Honeybun.xcarchive/Products/Applications/App.app"
          bad=0
          strings -a "$APP/App" > "$RUNNER_TEMP/bin.strings"
          echo "--- code that must be in the Release binary ---"
          for sym in HoneybunRoot HBRootView HBAuthFlowView HBAuthModel HBAccountView HBSetupView HBOnboardingView HBPasskeyService HBAppleButton HBHomeView HBMoneyView HBGoalsView HBTogetherView HBInboxView HBPlanView HBStatsView HBReferralsView HBHelpView HBTipsView HBShortcutView HBBudgetEditor HBDebtForm; do
            n=$(grep -c "$sym" "$RUNNER_TEMP/bin.strings" || true); echo "$sym: $n"
            [ "${n:-0}" = "0" ] && { echo "::error::$sym is missing from the Release binary"; bad=1; }
          done
          for lit in "me.honeybun.session" "key type Honeybun doesn't support" "A friend invited you to Honeybun" "Add minimum payments to see your debt-free date." "Run the quick paydays & bills setup again" "hb-native-apns-token"; do
            n=$(grep -c -F "$lit" "$RUNNER_TEMP/bin.strings" || true); echo "text [$lit]: $n"
            [ "${n:-0}" = "0" ] && { echo "::error::session/passkey code ($lit) is missing from the Release binary"; bad=1; }
          done
          echo "--- debug-only code that must NOT be in the Release binary ---"
          for sym in HBMockServer HBPreviewData HBPreviewVariants "mock.sub" DemoRoot DemoStore NativeDemo; do
            n=$(grep -c "$sym" "$RUNNER_TEMP/bin.strings" || true); echo "$sym: $n"
            [ "${n:-0}" != "0" ] && { echo "::error::$sym (debug-only) is in the Release binary"; bad=1; }
          done
          echo "--- obsolete beta / placeholder UI must be gone ---"
          for lit in "isn't native yet" "Native Honeybun (beta)" "Try native Honeybun"; do
            n=$(grep -c -F "$lit" "$RUNNER_TEMP/bin.strings" || true); echo "[$lit]: $n"
            [ "${n:-0}" != "0" ] && { echo "::error::obsolete text ($lit) is still in the Release binary"; bad=1; }
          done
          echo "--- native is the launch root: no main storyboard at launch ---"
          if /usr/libexec/PlistBuddy -c "Print :UIMainStoryboardFile" "$APP/Info.plist" >/dev/null 2>&1; then echo "::error::UIMainStoryboardFile is still set: Classic would open first"; bad=1; else echo "no UIMainStoryboardFile (good)"; fi
          echo "--- UIScene lifecycle (required by the iOS 26+ SDKs) ---"
          if /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName" "$APP/Info.plist" 2>/dev/null | grep -q "SceneDelegate"; then echo "scene manifest names SceneDelegate (good)"; else echo "::error::UIApplicationSceneManifest / SceneDelegate is missing from the built Info.plist"; bad=1; fi
          n=$(grep -c "SceneDelegate" "$RUNNER_TEMP/bin.strings" || true); echo "SceneDelegate in binary: $n"
          [ "${n:-0}" = "0" ] && { echo "::error::SceneDelegate is missing from the Release binary"; bad=1; }
          echo "--- privacy manifests ---"
          [ -f "$APP/PrivacyInfo.xcprivacy" ] && echo "app PrivacyInfo.xcprivacy present" || { echo "::error::PrivacyInfo.xcprivacy is missing from App.app"; bad=1; }
          [ -f "$APP/PlugIns/HoneybunWidget.appex/PrivacyInfo.xcprivacy" ] && echo "widget PrivacyInfo.xcprivacy present" || { echo "::error::PrivacyInfo.xcprivacy is missing from the widget"; bad=1; }
          echo "--- the Google sign-in is gone ---"
          n=$(grep -ci "accounts.google.com\|google_client\|GIDSignIn" "$RUNNER_TEMP/bin.strings" || true); echo "google references: $n"
          [ "${n:-0}" != "0" ] && { echo "::error::Google sign-in references remain in the Release binary"; bad=1; }
          echo "--- artwork in the compiled asset catalog ---"
          xcrun assetutil --info "$APP/Assets.car" > "$RUNNER_TEMP/assets.json" 2>/dev/null || true
          for img in HBSplash HBHero HBFormPeek HBGoalsPeek HBGoalIcon_palm HBStreak HBMoneyBun HBScene HBInboxTip HBTogetherPeek HBHouseholdScene; do
            n=$(grep -c "\"Name\" : \"$img\"" "$RUNNER_TEMP/assets.json" || true); echo "$img: $n"
            [ "${n:-0}" = "0" ] && { echo "::error::$img is missing from the Release asset catalog"; bad=1; }
          done
          echo "--- permissions the app asks for (from App.entitlements, signed ad hoc only to read them back) ---"
          codesign --force --sign - --entitlements App/App.entitlements "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee "$RUNNER_TEMP/ent.txt"
          grep -q "com.apple.developer.applesignin" "$RUNNER_TEMP/ent.txt" || { echo "::error::Sign in with Apple entitlement missing"; bad=1; }
          grep -q "applinks:honeybun.me" "$RUNNER_TEMP/ent.txt" || { echo "::error::Associated Domains (applinks:honeybun.me) missing"; bad=1; }
          grep -q "webcredentials:honeybun.me" "$RUNNER_TEMP/ent.txt" || { echo "::error::Associated Domains (webcredentials:honeybun.me) missing"; bad=1; }
          exit $bad

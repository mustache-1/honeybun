# Takes simulator screenshots of the native SwiftUI screens (debug preview mode: sample data, no login) so they can be checked against the
# mockups. The pictures are pushed to the `ci-shots` branch (replaced every run). Nothing here touches TestFlight or the App Store.
name: iPhone app (native screenshots)

on:
  workflow_dispatch:
    inputs:
      screens:
        description: "Which native screens to photograph (space separated)"
        default: "home money goals goaldetail goalform goaledit addexp addinc editexp upcoming editbill splash"
      small:
        description: "Also photograph on a small (home-button) iPhone"
        default: "true"

permissions:
  contents: write

concurrency:
  group: ios-shots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use the newest Xcode
        working-directory: .
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install Capacitor and sync the native project
        run: |
          npm install
          npx cap sync ios
      - name: Add the native targets to the Xcode project
        run: ruby scripts/setup_native.rb
      - name: Install pods
        working-directory: ios-app/ios/App
        run: pod install
      - name: Build (Debug, simulator)
        working-directory: ios-app/ios/App
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -30
          grep -q "BUILD SUCCEEDED" build.log
      - name: Screenshots (each picture is published as soon as it is taken)
        shell: bash
        run: |
          # run a command with a time limit (macOS has no `timeout`)
          run_to() { local secs=$1; shift; "$@" & local pid=$!; ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) & local w=$!; wait "$pid" 2>/dev/null; local rc=$?; kill "$w" 2>/dev/null; return $rc; }
          log() { echo "[$(date -u +%H:%M:%S)] $*"; }
          APP=$(find "$RUNNER_TEMP/dd" -path "*Debug-iphonesimulator/App.app" -maxdepth 6 | head -1)
          log "app: $APP"
          PUB="$RUNNER_TEMP/pub"; rm -rf "$PUB"; mkdir -p "$PUB"; cd "$PUB"
          git init -q; git checkout -q -b ci-shots
          echo "native screenshots from ${GITHUB_SHA}" > README.txt
          publish() {
            git add -A
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "$1" || return 0
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots 2>&1 | tail -1
          }
          publish "start"
          cd - > /dev/null
          touch "$RUNNER_TEMP/mark"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devs.json"
          python3 - "$RUNNER_TEMP/devs.json" "${{ github.event.inputs.small || 'true' }}" > "$RUNNER_TEMP/picked.txt" <<'PY'
          import json,sys,re
          d=json.load(open(sys.argv[1])); phones=[]
          for rt,devs in d['devices'].items():
              if 'iOS' not in rt: continue
              for x in devs:
                  if x['name'].startswith('iPhone'): phones.append((rt,x['name'],x['udid']))
          def pick(pattern):
              m=[p for p in phones if re.search(pattern,p[1])]
              return m[-1] if m else None
          big=pick(r'iPhone 1[5-9] Pro$') or pick(r'Pro$') or phones[-1]
          small=pick(r'SE') or pick(r'iPhone 1\de$') or pick(r'iPhone 1[3-9]$')
          print('big',big[2],big[1].replace(' ','_'))
          if small and small[2]!=big[2] and sys.argv[2]=='true': print('small',small[2],small[1].replace(' ','_'))
          PY
          cat "$RUNNER_TEMP/picked.txt"
          while read -r tag udid name; do
            log "=== $tag $name"
            run_to 120 xcrun simctl boot "$udid" || true
            run_to 240 xcrun simctl bootstatus "$udid" -b || log "bootstatus gave up"
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
            run_to 120 xcrun simctl install "$udid" "$APP" || log "install failed"
            # a throwaway first launch: the first start after an install is slow and sometimes fails to come up
            xcrun simctl launch "$udid" me.honeybun.app -HBPreview home > /dev/null 2>&1 || true; sleep 10; xcrun simctl terminate "$udid" me.honeybun.app || true
            for screen in ${{ github.event.inputs.screens || 'home money addexp addinc editexp upcoming editbill splash' }}; do
              # `fresh` = a normal launch with no test arguments (what a real user gets); `classicdemo` = Native → Classic → Native round trip
              args=(-HBPreview "$screen")
              case "$screen" in fresh) args=();; freshearly) args=();; classicdemo) args=(-HBClassicDemo);; esac
              run_to 60 xcrun simctl launch --terminate-running-process "$udid" me.honeybun.app ${args[@]+"${args[@]}"} > /dev/null || log "launch $screen failed"
              if [ "$screen" = "freshearly" ]; then sleep 1; elif [ "$screen" = "classicdemo" ]; then
                sleep 3; run_to 60 xcrun simctl io "$udid" screenshot "$PUB/${tag}_classicdemo_1_native.png" || true
                sleep 9; run_to 60 xcrun simctl io "$udid" screenshot "$PUB/${tag}_classicdemo_2_classic.png" || true
                sleep 9; run_to 60 xcrun simctl io "$udid" screenshot "$PUB/${tag}_classicdemo_3_back.png" || true
                xcrun simctl spawn "$udid" log show --last 3m --style compact --predicate 'eventMessage CONTAINS "HBROOT"' 2>/dev/null | tail -30 > "$PUB/log_${tag}_classicdemo.txt" || true
                ( cd "$PUB" && publish "${tag} classicdemo" )
              else sleep 6; fi
              run_to 60 xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/${tag}_${screen}.png" || log "screenshot $screen failed"
              # if the app died, keep its crash report and recent log lines so the cause can be read
              for f in $(find "$HOME/Library/Logs/DiagnosticReports" -name '*.ips' -newer "$RUNNER_TEMP/mark" 2>/dev/null | head -2); do cp "$f" "$PUB/crash_${tag}_${screen}_$(basename "$f").txt"; done
              if ! xcrun simctl spawn "$udid" launchctl list 2>/dev/null | grep -q "me.honeybun.app"; then
                log "app is not running after launching $screen"
                xcrun simctl spawn "$udid" log show --last 2m --style compact --predicate 'process == "App" OR eventMessage CONTAINS "honeybun"' 2>/dev/null | tail -80 > "$PUB/log_${tag}_${screen}.txt" || true
              fi
              xcrun simctl terminate "$udid" me.honeybun.app || true
              if [ -f "$RUNNER_TEMP/${tag}_${screen}.png" ]; then
                cp "$RUNNER_TEMP/${tag}_${screen}.png" "$PUB/"
                ( cd "$PUB" && publish "${tag} ${screen}" )
              else
                ( cd "$PUB" && publish "${tag} ${screen} (no picture)" )
                log "published ${tag}_${screen}"
              fi
            done
            xcrun simctl shutdown "$udid" || true
          done < "$RUNNER_TEMP/picked.txt"
          log "done"

# Takes simulator screenshots of the native SwiftUI screens (debug preview mode: sample data, no login) so they can be checked against the
# mockups. The pictures are pushed to the `ci-shots` branch (replaced every run). Nothing here touches TestFlight or the App Store.
name: iPhone app (native screenshots)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-shots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use the newest Xcode
        working-directory: .
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install Capacitor and sync the native project
        run: |
          npm install
          npx cap sync ios
      - name: Add the native targets to the Xcode project
        run: ruby scripts/setup_native.rb
      - name: Install pods
        working-directory: ios-app/ios/App
        run: pod install
      - name: Build (Debug, simulator)
        working-directory: ios-app/ios/App
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -30
          grep -q "BUILD SUCCEEDED" build.log
      - name: Screenshots
        shell: bash
        run: |
          APP=$(find "$RUNNER_TEMP/dd" -path "*Debug-iphonesimulator/App.app" -maxdepth 6 | head -1)
          echo "app: $APP"
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devs.json"
          python3 - "$RUNNER_TEMP/devs.json" > "$RUNNER_TEMP/picked.txt" <<'PY'
          import json,sys,re
          d=json.load(open(sys.argv[1])); phones=[]
          for rt,devs in d['devices'].items():
              if 'iOS' not in rt: continue
              for x in devs:
                  if x['name'].startswith('iPhone'): phones.append((rt,x['name'],x['udid']))
          def pick(pattern):
              m=[p for p in phones if re.search(pattern,p[1])]
              return m[-1] if m else None
          big=pick(r'iPhone 1[5-9] Pro$') or pick(r'Pro$') or phones[-1]
          small=pick(r'SE') or pick(r'iPhone 1\de$') or pick(r'iPhone 1[3-9]$')
          print('big',big[2],big[1].replace(' ','_'))
          if small and small[2]!=big[2]: print('small',small[2],small[1].replace(' ','_'))
          PY
          cat "$RUNNER_TEMP/picked.txt"
          while read -r tag udid name; do
            echo "=== $tag $name"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
            xcrun simctl install "$udid" "$APP"
            for screen in home money addexp addinc editexp upcoming editbill; do
              xcrun simctl launch --terminate-running-process "$udid" me.honeybun.app -HBPreview "$screen" > /dev/null
              sleep 9
              xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/shots/${tag}_${screen}.png"
              xcrun simctl terminate "$udid" me.honeybun.app || true
            done
            xcrun simctl shutdown "$udid" || true
          done < "$RUNNER_TEMP/picked.txt"
          ls -la "$RUNNER_TEMP/shots"
      - name: Publish the screenshots to the ci-shots branch
        working-directory: .
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/pub" && mkdir "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          git init -q && git checkout -q -b ci-shots
          cp "$RUNNER_TEMP"/shots/*.png .
          echo "native screenshots from ${GITHUB_SHA}" > README.txt
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "native screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots

# Fast static check of the Xcode project (no Xcode, no secrets): every Swift file is in the App target, no duplicate
# references, shared App scheme + workspace present, UIScene manifest in place, iOS 15 targets. Runs on Linux in seconds.
name: iPhone project check

on:
  workflow_dispatch:
  pull_request:
    paths: ["ios-app/ios/**", "ios-app/scripts/**", ".github/workflows/ios-project-check.yml"]
  push:
    branches: [claude/wizardly-ritchie-b9p7jn]
    paths: ["ios-app/ios/**", "ios-app/scripts/**", ".github/workflows/ios-project-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install xcodeproj --no-document
      - name: Project checks
        run: ruby ios-app/scripts/check_project.rb

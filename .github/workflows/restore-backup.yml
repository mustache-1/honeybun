name: Restore Honeybun backup

on:
  push:
    branches: [main]
    paths:
      - '.restore/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Replace current app with uploaded backup
        shell: bash
        run: |
          set -euo pipefail

          # Remove every Honeybun UI override/helper that was added after the backup.
          rm -f public/hb-*.css public/hb-*.js
          rm -f download src/read.txt

          # Reassemble the exact large text files from the uploaded backup.
          cat .restore/public__app.js.part-* > public/app.js
          cat .restore/public__i18n.js.part-* > public/i18n.js
          cat .restore/public__index.html.part-* > public/index.html
          cat .restore/src__worker.js.part-* > src/worker.js

          # Restore the smaller backup files.
          cp .restore/README.md README.md
          cp .restore/schema.sql schema.sql
          cp .restore/boot.js public/boot.js
          cp .restore/sw.js public/sw.js
          cp .restore/gitignore .gitignore
          cp .restore/wrangler.jsonc wrangler.jsonc

          # Keep the real production D1 database binding instead of the placeholder from the ZIP.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('wrangler.jsonc')
          s = p.read_text()
          s = s.replace('PASTE-YOUR-DATABASE-ID-HERE', 'f32e430a-fa1e-45b2-827f-32b3c6c80e64')
          p.write_text(s)
          PY

          # Remove the one-time restore payload/workflow after the backup is in place.
          rm -rf .restore
          rm -f .github/workflows/restore-backup.yml

      - name: Commit restored backup to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Honeybun Restore'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Honeybun from uploaded backup'
          git push origin HEAD:main

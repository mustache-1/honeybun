<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Honeybun</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%}
body{display:grid;place-items:center;overflow:hidden;color:#f8f4f8;font:600 15px system-ui,"Segoe UI",sans-serif;
  background:radial-gradient(ellipse at 50% 30%,#2b1c3a 0%,#181120 60%,#110c17 100%)}
.box{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:-4vh}
svg.bun{width:150px;height:158px;overflow:visible}
.hb-bun-body{transform-origin:80px 150px;animation:hop 1.6s cubic-bezier(.3,0,.3,1) infinite}
.hb-bun-shadow{fill:rgba(0,0,0,.35);transform-origin:80px 162px;animation:sh 1.6s cubic-bezier(.3,0,.3,1) infinite}
.hb-ear path,.hb-head{fill:#fff;stroke:#2B2733;stroke-width:5;stroke-linejoin:round}
.hb-ear-in{fill:#F6B8CB!important;stroke:none!important}
.hb-eyes ellipse{fill:#2B2733}.hb-shine{fill:#fff}.hb-cheek{fill:#F6B8CB}
.hb-mouth{fill:none;stroke:#2B2733;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.hat{transform-origin:80px 70px;animation:sway 1.6s ease-in-out infinite}
@keyframes hop{0%,55%,100%{transform:translateY(0)}72%{transform:translateY(-22px)}84%{transform:translateY(0)}}
@keyframes sh{0%,55%,100%{transform:scale(1)}72%{transform:scale(.8);opacity:.6}}
@keyframes sway{0%,45%,100%{transform:rotate(0)}64%{transform:rotate(-6deg) translateY(-3px)}80%{transform:rotate(3deg)}}
h1{margin:6px 0 0;font-size:22px;letter-spacing:.2px}
#msg{color:#cfc4d6;min-height:20px}
.bar{width:220px;height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#F59A4A,#F28C38);animation:slide 1.2s ease-in-out infinite}
.bar.pct i{animation:none;transition:width .25s}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
</style>
</head>
<body>
<div class="box">
<svg class="bun" viewBox="0 0 160 170"><ellipse class="hb-bun-shadow" cx="80" cy="162" rx="44" ry="6"/><g class="hb-bun-body"><g class="hb-ear hb-ear-l"><path d="M58 70 C44 40 44 8 55 6 C66 4 71 36 72 62"/><path class="hb-ear-in" d="M59 58 C52 38 53 18 57 16 C61 15 64 36 65 52"/></g><g class="hb-ear hb-ear-r"><path d="M102 70 C116 40 116 8 105 6 C94 4 89 36 88 62"/><path class="hb-ear-in" d="M101 58 C108 38 107 18 103 16 C99 15 96 36 95 52"/></g><ellipse class="hb-head" cx="80" cy="108" rx="50" ry="45"/><g class="hb-eyes"><ellipse cx="63" cy="103" rx="5.5" ry="6.5"/><ellipse cx="97" cy="103" rx="5.5" ry="6.5"/><circle class="hb-shine" cx="65" cy="100.5" r="1.8"/><circle class="hb-shine" cx="99" cy="100.5" r="1.8"/></g><ellipse class="hb-cheek" cx="49" cy="118" rx="9" ry="5"/><ellipse class="hb-cheek" cx="111" cy="118" rx="9" ry="5"/><path class="hb-mouth" d="M72 117 q4 5 8 0 q4 5 8 0"/></g></svg>
<h1>Honeybun</h1>
<div id="msg">Checking for updates…</div>
<div class="bar" id="bar"><i id="fill"></i></div>
</div>
<script>
// Bun wears his witch hat during Halloween (Sept 29 to Oct 31), like the website
(function(){var d=new Date(),m=d.getMonth();if(m===9||(m===8&&d.getDate()>=29)){
 document.querySelector('.hb-bun-body').insertAdjacentHTML('beforeend','<g class="hat"><path d="M56 70 Q80 56 104 70 Q80 78 56 70z" fill="#2a1b3d" stroke="#2B2733" stroke-width="3" stroke-linejoin="round"/><path d="M66 68 L76 24 Q80 14 88 28 L96 68 Q80 74 66 68z" fill="#3a2452" stroke="#2B2733" stroke-width="3" stroke-linejoin="round"/><path d="M68 60 Q80 66 94 60 L95.5 66 Q80 72 67 66z" fill="#F28C38"/><rect x="77" y="60" width="7" height="8" rx="1.5" fill="#F6C94E"/><path d="M84 20l1.6 3.6 3.9.4-2.9 2.6.9 3.8-3.5-2-3.5 2 .9-3.8-2.9-2.6 3.9-.4z" fill="#F6C94E"/></g>');}})();
// the app calls this while it checks for and installs updates
window.hbStatus=function(text,pct){
  document.getElementById('msg').textContent=text;
  var bar=document.getElementById('bar'),fill=document.getElementById('fill');
  if(pct==null){bar.classList.remove('pct');fill.style.width='';}
  else{bar.classList.add('pct');fill.style.width=pct+'%';}
};
</script>
</body>
</html>
